# Railway/Nixpacks build config — FFmpeg for video. The frontend is pre-built
# (frontend/dist committed) and served by the backend, so no Node build here.
[phases.setup]
nixPkgs = ["python311", "ffmpeg", "gcc"]

[phases.install]
cmds = ["python3 -m venv /opt/venv", "/opt/venv/bin/pip install --upgrade pip", "/opt/venv/bin/pip install -r backend/requirements.txt"]

[start]
cmd = "/opt/venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
