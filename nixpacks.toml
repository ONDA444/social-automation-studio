# Railway/Nixpacks build config.
#  - ffmpeg for video processing
#  - nodejs to BUILD the frontend on the container (backend serves frontend/dist),
#    so the SPA is always present regardless of upload-ignore rules.
[phases.setup]
nixPkgs = ["python311", "ffmpeg", "gcc", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r backend/requirements.txt",
  "cd frontend && npm ci && npm run build",
]

[start]
cmd = "/opt/venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
